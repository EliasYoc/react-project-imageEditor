# Integración continua (CI): comprueba cada PR y cada push a dev y main en
# los servidores de GitHub (Ubuntu). Son los mismos comandos que en local:
# si un paso falla aquí, se repite en el equipo con el mismo comando para
# investigarlo (ver la sección "CI" del README).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Solo lectura del repositorio: este workflow no publica ni cambia nada.
permissions:
  contents: read

# Un push nuevo a la misma rama o PR cancela la ejecución anterior, que ya
# no sirve (así se ahorran minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formato, lint, tipos, tests y tamaño
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Las acciones se fijan por su commit (SHA) y no por una etiqueta como
      # "v7", que se puede mover. Dependabot las actualiza (dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Instalación limpia, exactamente con lo que dice package-lock.json.
      - run: npm ci
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Lint, tipos y tests unitarios
        run: npm run check
      - name: Build
        run: npm run build
      - name: Presupuesto de tamaño del JS
        run: npm run size

  e2e:
    name: Tests e2e (Playwright)
    # Solo si lo anterior pasa: no se gastan minutos en algo que ya falla.
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Usa el Microsoft Edge que ya trae el runner de Ubuntu: no se descarga
      # ningún navegador.
      # --retries=2: un test que falla y al repetirlo pasa sale como "flaky"
      #   en el informe, en lugar de bloquear la PR.
      # --forbid-only: falla si se quedó un test.only por error.
      - name: Tests e2e
        run: npx playwright test --forbid-only --retries=2
      # Si algo falla, el informe (con capturas y trazas de cada paso) se
      # descarga desde la página de la ejecución, en "Artifacts".
      - name: Subir el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
